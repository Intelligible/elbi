site_name: elbi
site_description: Author data context as code and serve it to agents over MCP.
site_url: https://intelligible.github.io/elbi/
repo_url: https://github.com/Intelligible/elbi
repo_name: Intelligible/elbi
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md

  - Get started:
      - Getting started: getting-started.md
      - Data sources: data-sources.md
      - Connect your AI agent (MCP): mcp.md
      - CLI: cli.md

  - Derivations:
      - Creating derivations with agents: authoring.md
      - Writing derivations manually: derivations.md
      - Data contracts: data-contracts.md
      - Verification certificates: certificates.md
      - Result history: result-history.md
      - Caching & staleness: caching.md
      - Lineage & catalog: lineage.md
      - Derivation specification: spec.md

  - GUI:
      - Explore (SQL & profiling): explore.md
      - Search indexing: search-documents.md
      - Notebooks: notebooks.md
      - Models & AutoML: models.md
      - Feature store: feature-store.md
      - Metrics (semantic layer): metrics.md
      - Dashboards: dashboards.md
      - Supported browsers: browsers.md

  - Automation & monitoring:
      - Pipelines & orchestration: orchestration.md
      - Monitoring & alerting: monitoring.md

  - Configuration & deployment:
      - Analytics as code: analytics-as-code.md
      - Compute engines: compute-engines.md
      - Compute: compute.md
      - Running in Docker: docker.md
      - Exports & data portability: exports.md
      - Privacy & telemetry: privacy.md
      - Upgrading: upgrading.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/elbi-core/src]
          options:
            show_source: false
            docstring_style: google
