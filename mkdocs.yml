site_name: elbi
site_description: Author data context as code and serve it to agents over MCP.
site_url: https://intelligible.github.io/elbi/
repo_url: https://github.com/Intelligible/elbi
repo_name: Intelligible/elbi
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Authoring derivations: derivations.md
  - Agent-authored derivations: authoring.md
  - Data contracts: data-contracts.md
  - Compute engines: compute-engines.md
  - Result history: result-history.md
  - Exports and data portability: exports.md
  - Verification certificates: certificates.md
  - Explore (SQL & profiling): explore.md
  - Notebooks: notebooks.md
  - Compute: compute.md
  - Models & AutoML: models.md
  - Feature store: feature-store.md
  - Metrics (semantic layer): metrics.md
  - Monitoring & alerting: monitoring.md
  - Dashboards: dashboards.md
  - Lineage & catalog: lineage.md
  - Pipelines & orchestration: orchestration.md
  - Data sources: data-sources.md
  - Caching & staleness: caching.md
  - The CLI: cli.md
  - Upgrading: upgrading.md
  - Analytics as code: analytics-as-code.md
  - Serving over MCP: mcp.md
  - Searching documents: search-documents.md
  - Running in Docker: docker.md
  - Privacy and telemetry: privacy.md
  - Supported browsers: browsers.md
  - The derivation spec: spec.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/elbi-core/src]
          options:
            show_source: false
            docstring_style: google
