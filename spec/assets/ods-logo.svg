<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 72" width="372" height="72" role="img" aria-label="Open Derivation Spec">
  <title>Open Derivation Spec</title>
  <!-- derivation mark: two inputs converge into one derived result -->
  <g fill="none" stroke="#7C9093" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
    <path d="M16 25 L30 49" />
    <path d="M44 25 L30 49" />
  </g>
  <circle cx="16" cy="25" r="6" fill="#7C9093" />
  <circle cx="44" cy="25" r="6" fill="#7C9093" />
  <circle cx="30" cy="49" r="7" fill="#004E51" />
  <!-- wordmark -->
  <text x="74" y="44"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="1.6" fill="#004E51">OPEN DERIVATION SPEC</text>
</svg>
