name: Publish image

# Build the container image. On main and version tags the
# image is pushed to GitHub Container Registry; on pull requests it is only built, so
# packaging breakage is caught without publishing.
#
# No path filter on the workflow itself: a required check on a workflow that did not run is
# never reported, and the pull request then waits on it forever. `changes` classifies the
# commit instead, and `image-ok` reports once for everything here.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Same as CI: the queue needs these checks on its temporary branch, or nothing merges.
  merge_group:
  workflow_dispatch:

# Read-only by default. A job that needs more says so itself, which keeps the blast radius
# of a compromised action to what that one job was granted rather than to everything the
# token could reach.
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Deliberately NOT ${{ github.repository }}: the published coordinate has to stay
  # stable if the repository is ever renamed or moved, because it is what the compose
  # file and the cosign commands in the docs both name.
  IMAGE_NAME: intelligible/elbi

jobs:
  # Classifies the commit so `image` can skip a sixty-minute build the change cannot
  # affect, while still reporting through `image-ok`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The filter reads the pull request's file list from the API, which the
      # read-only default does not cover: without this it fails with "resource not
      # accessible by integration".
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Credentials kept here, unlike everywhere else. On a merge-group build there is
          # no pull request to ask the API about, so the filter compares refs with git and
          # has to fetch the base -- which needs auth. Without it the fetch fails with
          # "could not read Username" and the queue evicts every candidate.
          #
          # Scoped to this job, which runs one action and no build.
          persist-credentials: true
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A merge-group build has no pull request to ask the API about, so compare
          # against the branch the queue is merging into.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || '' }}
          filters: |
            image:
              - "Dockerfile"
              - ".dockerignore"
              - "packages/**"
              - "pyproject.toml"
              - "uv.lock"
              - "docker-compose.yml"
              - ".github/workflows/docker-publish.yml"

  # A pull request only has to prove the image still builds, so it builds the native
  # architecture and pushes nothing.
  image:
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.changes.outputs.image == 'true' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # To read the build cache the push path writes. The package is private, so an
      # anonymous pull sees nothing; this grants that read and nothing else.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is not needed after cloning; leaving it in .git/config
          # hands it to every later step, including any action they call.
          persist-credentials: false
      - name: Free up runner disk space
        run: .github/free-disk-space.sh
      # GHCR rejects uppercase, and github.repository carries the org's casing.
      - name: Lowercase the image name
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Reads what main last pushed for this architecture. A pull request cannot write
          # it, so a cold cache means main has not rebuilt since the base changed --
          # slower, never wrong.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-linux-amd64
      - name: Disk after the build
        if: always()
        run: df -h / | tail -1

  # One runner per architecture. Both builds on one runner needed ~43 GB of the ~47 GB
  # the reclaim leaves (measured: 3.7 GB remaining when it died), because the full ML
  # stack is built in one stage, copied into the next, and then done again for the
  # second platform. Each runner now pushes its own layers by digest and the merge job
  # below assembles the manifest list -- Docker's documented approach for an image this
  # size, and the only one that does not sit at the edge of the disk.
  # Each architecture builds on a runner of that architecture. arm64 was emulated under
  # QEMU, which cost 47 minutes a leg and put the slowest, least representative build on
  # the critical path -- an emulated build is not the artifact users run. GitHub's arm64
  # runners are standard runners, billed the same as the amd64 ones rather than as larger
  # runners, so this is faster at no extra cost. It is also what jupyter/docker-stacks and
  # immich both do; neither emulates.
  image-push:
    # `push`, not `!= pull_request`: a merge-group build must not publish. It is a
    # candidate being verified, and it is thrown away if the queue rejects it.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is not needed after cloning; leaving it in .git/config
          # hands it to every later step, including any action they call.
          persist-credentials: false

      - name: Free up runner disk space
        run: .github/free-disk-space.sh

      - name: Name this platform for the artifact key
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # GHCR rejects uppercase, and github.repository carries the org's casing.
      - name: Lowercase the image name
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Deliberately untagged: a per-architecture push must not claim the shared
          # tag or the two platforms overwrite each other. The merge job tags the
          # manifest list instead.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # In the registry rather than in Actions' cache. Exporting to `type=gha` is what
          # exhausted this runner's disk even at mode=min, because it stages the whole
          # export locally before uploading; a registry export streams to GHCR instead.
          # Keyed per architecture, or the two legs of the matrix overwrite each other.
          #
          # `mode=max` keeps the intermediate stages, which is the whole point here: the
          # expensive layers are in build stages the final image does not carry, so a
          # min-mode cache would record almost nothing worth reusing. The disk reclaim runs
          # before this and `df -h` runs after, so if it is still too tight the log says so.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_SLUG }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_SLUG }},mode=max
          sbom: true
          provenance: mode=max

      - name: Disk after the build
        if: always()
        run: df -h / | tail -1

      - name: Record the digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$BUILD_DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-architecture digests into one tagged manifest list, then sign it.
  image-manifest:
    # `push`, not `!= pull_request`: a merge-group build must not publish. It is a
    # candidate being verified, and it is thrown away if the queue rejects it.
    if: github.event_name == 'push'
    needs: image-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (OIDC identity from Fulcio)
    steps:
      - name: Lowercase the image name
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # Built as an array rather than by splitting a string: every tag and digest
          # reaches docker as exactly one argument, whatever it contains.
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Read the manifest-list digest
        id: digest
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${META_VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      # Keyless (Sigstore) signing. One signature over the manifest-list digest covers
      # every tag pointing at it.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the manifest by digest
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The single check to require for this workflow; see `ci-ok` for why an aggregate rather
  # than the jobs themselves.
  image-ok:
    if: always()
    needs: [changes, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled|timed_out)"'; then
            echo "::error::a required job did not pass"
            exit 1
          fi
