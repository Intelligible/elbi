name: Open Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Fork and Dependabot runs get no secrets, so there is nothing to review with.
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: alibaba/open-code-review@182898cf522da3d04157b422752d028417974e19 # v1.12.12
        with:
          ocr_version: '1.12.12'
          llm_url: https://api.anthropic.com/v1/messages
          llm_auth_token: ${{ secrets.OCR_ANTHROPIC_API_KEY }}
          llm_model: claude-opus-5-5
          llm_use_anthropic: 'true'
          checkpoint_range: 'true'
