name: Open Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Fork and Dependabot runs get no OIDC token, so there is nothing to review with.
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token for an Anthropic token
        id: anthropic
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: |
          jwt=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -er .value)
          echo "::add-mask::$jwt"
          if ! resp=$(jq -n \
            --arg jwt "$jwt" --arg rule "$FEDERATION_RULE_ID" \
            --arg org "$ORGANIZATION_ID" --arg sa "$SERVICE_ACCOUNT_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $jwt,
              federation_rule_id: $rule, organization_id: $org, service_account_id: $sa}' \
            | curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
                -H "content-type: application/json" -d @-); then
            echo "::error::Anthropic token exchange failed: $resp"
            exit 1
          fi
          token=$(jq -er .access_token <<<"$resp")
          echo "::add-mask::$token"
          echo "Anthropic token expires in $(jq -r .expires_in <<<"$resp")s"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: alibaba/open-code-review@182898cf522da3d04157b422752d028417974e19 # v1.12.12
        with:
          ocr_version: '1.12.12'
          llm_url: https://api.anthropic.com/v1/messages
          llm_auth_token: ${{ steps.anthropic.outputs.token }}
          llm_auth_header: authorization
          llm_model: claude-opus-5-5
          llm_use_anthropic: 'true'
          checkpoint_range: 'true'
