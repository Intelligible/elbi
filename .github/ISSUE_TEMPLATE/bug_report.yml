name: Bug Report
description: Report a defect in the SDK, CLI, or spec.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report.
  - type: input
    id: version
    attributes:
      label: elbi version
      placeholder: "e.g. 0.1.0 (output of `elbi --version`)"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.10", "3.11", "3.12", "3.13"]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: ["SDK (elbi)", "CLI (elbi-cli)", "Spec", "Docs"]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include a minimal reproduction and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
